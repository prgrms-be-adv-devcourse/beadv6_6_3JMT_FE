<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>주문 내역</title>
<style>
  :root {
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --border: #e5e5e5;
    --border-strong: #d6d6d6;
    --surface: #ffffff;
    --page-bg: #ffffff;
    --badge-bg: #eaf1fb;
    --badge-text: #2563a8;
    --row-hover: #fafafa;
    --panel-bg: #fafafa;
    --grid-cols: 1.4fr 1fr 1fr 1fr 96px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px;
    background: var(--page-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    color: var(--text-primary);
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
  .subtitle { font-size: 14px; color: var(--text-secondary); margin: 0 0 28px; }

  .order-table { border: none; }

  .table-header {
    display: grid;
    grid-template-columns: var(--grid-cols);
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .table-header span {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .order-row {
    display: grid;
    grid-template-columns: var(--grid-cols);
    align-items: center;
    padding: 18px 16px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .order-row:hover { background: var(--row-hover); }
  .order-id { font-weight: 700; }
  .order-amount { font-weight: 700; }
  .muted { color: var(--text-secondary); }

  .chevron-cell { text-align: right; }
  .chevron {
    display: inline-block;
    color: var(--text-secondary);
    font-size: 12px;
    transition: transform 0.15s ease;
  }
  .order-row.expanded .chevron { transform: rotate(180deg); }

  .badge {
    display: inline-block;
    background: var(--badge-bg);
    color: var(--badge-text);
    font-size: 13px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 999px;
  }

  .item-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    padding: 2px 10px;
    border-radius: 999px;
  }
  .item-badge.paid { background: #eaf1fb; color: #2563a8; }
  .item-badge.pending { background: #fdf1de; color: #a05a06; }
  .item-badge.refunded { background: #f0f0f0; color: #6b6b6b; }

  .detail-panel {
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
  }
  .detail-panel.hidden { display: none; }

  .item-row {
    display: grid;
    grid-template-columns: var(--grid-cols);
    align-items: center;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
  }
  .item-row:first-child { border-top: none; }
  .item-name {
    grid-column: 1 / 3;
    font-size: 14px;
    font-weight: 500;
    padding-right: 12px;
  }
  .item-price { font-size: 14px; color: var(--text-secondary); }
  .item-refund-btn {
    justify-self: end;
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    cursor: pointer;
    white-space: nowrap;
  }
  .item-refund-btn:hover { background: #f0f0f0; }
  .item-refund-btn:disabled {
    color: var(--text-secondary);
    cursor: not-allowed;
    background: #f5f5f5;
  }
  .item-refund-btn:disabled:hover { background: #f5f5f5; }
</style>
</head>
<body>

<div class="container">
  <h1>주문 내역</h1>
  <p class="subtitle">주문한 내역과 환불 상태를 확인하세요.</p>

  <div class="order-table">
    <div class="table-header">
      <span>주문 번호</span>
      <span>주문일</span>
      <span>주문 금액</span>
      <span>상태</span>
      <span></span>
    </div>
    <div id="order-list"></div>
  </div>
</div>

<script>
  const orders = [
    {
      orderId: "ORD-20260628-001",
      date: "2026. 6. 28.",
      amount: 10000,
      status: "결제완료",
      items: [
        { name: "Spring Boot 코드 리뷰", amount: 6000, status: "결제완료" },
        { name: "Spring Boot 배포 가이드", amount: 4000, status: "환불신청중" }
      ]
    },
    {
      orderId: "ORD-20260628-002",
      date: "2026. 6. 28.",
      amount: 9000,
      status: "결제완료",
      items: [
        { name: "CSV 데이터 분석 도우미", amount: 9000, status: "환불완료" }
      ]
    }
  ];

  const orderList = document.getElementById("order-list");
  let openIdx = null;

  function formatWon(n) {
    return "\u20a9" + n.toLocaleString("ko-KR");
  }

  const ITEM_BADGE_CLASS = {
    "결제완료": "paid",
    "환불신청중": "pending",
    "환불완료": "refunded"
  };

  function refundButtonHtml(status) {
    if (status === "환불완료") return "<span></span>";
    if (status === "환불신청중") {
      return `<button class="item-refund-btn" disabled>신청됨</button>`;
    }
    return `<button class="item-refund-btn">환불 신청</button>`;
  }

  function itemsHtml(order) {
    return order.items.map((item) => `
      <div class="item-row">
        <div class="item-name">${item.name}</div>
        <div class="item-price">${formatWon(item.amount)}</div>
        <div><span class="item-badge ${ITEM_BADGE_CLASS[item.status]}">${item.status}</span></div>
        ${refundButtonHtml(item.status)}
      </div>
    `).join("");
  }

  function renderTable() {
    orderList.innerHTML = "";
    orders.forEach((order, idx) => {
      const isOpen = openIdx === idx;

      const orderRow = document.createElement("div");
      orderRow.className = "order-row" + (isOpen ? " expanded" : "");
      orderRow.dataset.idx = idx;
      orderRow.innerHTML = `
        <span class="order-id">${order.orderId}</span>
        <span class="muted">${order.date}</span>
        <span class="order-amount">${formatWon(order.amount)}</span>
        <span><span class="badge">${order.status}</span></span>
        <span class="chevron-cell"><span class="chevron">&#9660;</span></span>
      `;
      orderList.appendChild(orderRow);

      const detailPanel = document.createElement("div");
      detailPanel.className = "detail-panel" + (isOpen ? "" : " hidden");
      detailPanel.innerHTML = itemsHtml(order);
      orderList.appendChild(detailPanel);
    });
  }

  orderList.addEventListener("click", (e) => {
    if (e.target.closest(".item-refund-btn")) return;
    const row = e.target.closest(".order-row");
    if (!row) return;
    const idx = Number(row.dataset.idx);
    openIdx = openIdx === idx ? null : idx;
    renderTable();
  });

  renderTable();
</script>

</body>
</html>
